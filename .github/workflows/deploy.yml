name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  backend-package:
    name: Package Backend Artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify backend before deployment
        run: mvn -B verify

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/project-pulse-backend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

  deploy-backend:
    name: Deploy Backend To Azure App Service
    runs-on: ubuntu-latest
    needs: backend-package
    if: ${{ vars.AZURE_BACKEND_WEBAPP_NAME != '' && secrets.AZURE_BACKEND_WEBAPP_PUBLISH_PROFILE != '' }}
    environment: production
    steps:
      - name: Download backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-artifact

      - name: Deploy backend jar
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_BACKEND_WEBAPP_PUBLISH_PROFILE }}
          package: backend-artifact/project-pulse-backend-0.0.1-SNAPSHOT.jar

  deploy-frontend:
    name: Deploy Frontend To Azure Static Web Apps
    runs-on: ubuntu-latest
    if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    environment: production
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend bundle
        run: npm run build
        working-directory: frontend

      - name: Deploy frontend bundle
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          app_location: frontend/dist
          output_location: ''
          skip_app_build: true
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
