spring:
  config:
    activate:
      on-profile: local

server:
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false

app:
  security:
    require-https: false
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  email:
    base-url: ${APP_EMAIL_BASE_URL:http://localhost:5173}
  auth:
    bootstrap-admin:
      enabled: true
